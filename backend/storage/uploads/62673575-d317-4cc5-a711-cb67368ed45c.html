<!DOCTYPE html>
<html lang="ru">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Главная</title>
            <style>
                *{
                    box-sizing: border-box;
                    margin: 0;
                    padding: 0;
                }
                .cube {
  width: 200px;
  height: 200px;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCube 10s linear infinite;
  margin: 100px auto;
}

.face {
  position: absolute;
  width: 200px;
  height: 200px;
  background: rgba(0, 0, 0, 0.8);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
}

/* Позиционирование граней */
.front  { transform: translateZ(100px); }
.back   { transform: rotateY(180deg) translateZ(100px); }
.left   { transform: rotateY(-90deg) translateZ(100px); }
.right  { transform: rotateY(90deg) translateZ(100px); }
.top    { transform: rotateX(90deg) translateZ(100px); }
.bottom { transform: rotateX(-90deg) translateZ(100px); }


/* Анимация вращения */
@keyframes rotateCube {
  from { transform: rotateY(0deg) rotateX(0deg); }
  to   { transform: rotateY(360deg) rotateX(360deg); }
}
.card-3d {
  width: 300px;
  height: 400px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
  margin: 50px auto;
  perspective: 1000px;
}

.front-side, .back-side {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden; /* Скрывает обратную сторону */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  color: white;
}

.front-side {
  background: #FF5722;
  transform: rotateY(0deg);
}

.back-side {
  background: #2196F3;
  transform: rotateY(180deg);
}

/* Переворот при наведении */
.card-3d:hover {
  transform: rotateY(180deg);
}
.btn-3d {
  padding: 15px 30px;
  font-size: 18px;
  border: none;
  background: linear-gradient(#4CAF50, #2E7D32);
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  transform: perspective(500px) rotateX(0deg);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
}

.btn-3d:hover {
  transform: perspective(500px) rotateX(-10deg) translateY(-5px);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
}

            </style>
</head>
<body>
    <div class="cube">
  <div class="front">Front</div>
  <div class="back">Back</div>
  <div class="left">Left</div>
  <div class="right">Right</div>
  <div class="top">Top</div>
  <div class="bottom">Bottom</div>
</div>

<div class="card-3d">
  <div class="front-side">Лицо</div>
  <div class="back-side">Рубашка</div>
</div>
<button class="btn-3d">Нажми меня</button>
</body>
</html>
